name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  gateway-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/gateway/requirements-dev.txt
      - run: python -m pip install -r services/gateway/requirements-dev.txt
      - run: python -m pytest -q services/gateway/tests services/text/tests services/ocr/tests tests/integration

  url-python-313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/url/requirements-dev.txt
      - run: python -m pip install -r services/url/requirements-dev.txt
      - run: python -m pytest -q services/url/tests

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: docker compose config
      - name: Start clean fixture stack
        run: DEMO_MODE=true docker compose up --build --wait --wait-timeout 180
      - name: Verify fixture API, evaluation contract, and browser flow
        run: |
          python scripts/smoke.py --expect fixture
          python tests/e2e/upload_limit_smoke.py --expect-ocr-unavailable
          python evaluation/run_evaluation.py
          npm --prefix apps/web run test:e2e
      - name: Recreate live gateway and verify partial and unavailable paths
        run: |
          DEMO_MODE=false docker compose up -d --force-recreate --wait --wait-timeout 120 gateway web
          python scripts/smoke.py --expect partial
          python scripts/smoke.py --expect unavailable
      - name: Stop stack
        if: always()
        run: docker compose down --remove-orphans
