name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# No job needs a paid provider key, a secret, or a model download. The integration tests
# remove provider credentials from their environment and refuse non-loopback connections.

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  gateway-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/gateway/requirements-dev.txt
      - run: python -m pip install -r services/gateway/requirements-dev.txt
      - run: python -m pytest -q services/gateway/tests services/text/tests services/ocr/tests tests/integration
      # Structure rules for the 30-case development and 20-case holdout sets.
      - run: python evaluation/validate_fixtures.py
      # The synthetic scenarios as review sheets, so the two reviewers can label them without a local setup.
      - run: |
          python evaluation/validate_fixtures.py --review-sheet review-sheets/label-review.md
          python evaluation/validate_fixtures.py --review-sheet review-sheets/label-review-blind.md --blind
      - uses: actions/upload-artifact@v4
        with:
          name: label-review-sheets
          path: review-sheets/
      # Contract and degraded-mode run of the development set. It is not a detection result and
      # never runs the holdout. Fails on contract violations or unmet failure-scenario expectations.
      - run: python evaluation/run_evaluation.py --in-process --set development --check-expectations --output /tmp/development-contract-run.json

  url-python-313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/url/requirements-dev.txt
            services/gateway/requirements-dev.txt
      - run: python -m pip install -r services/url/requirements-dev.txt -r services/gateway/requirements-dev.txt
      # The integration tests that drive the real URL service need Python 3.13, so they run here
      # as well as in the gateway job, where they skip that part.
      - run: python -m pytest -q services/url/tests tests/integration
