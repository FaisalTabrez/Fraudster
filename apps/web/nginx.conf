server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /api/v1/extract {
    # Match the gateway's decimal 5 MB image + 64 KiB multipart envelope.
    client_max_body_size 5065536;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    error_page 413 = @extraction_too_large;
    proxy_pass http://gateway:8000/v1/extract;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }

  location @extraction_too_large {
    default_type application/json;
    return 413 '{"status":"unavailable","text":null,"boxes":[],"image":null,"detail":"Upload exceeds the 5 MB image limit or multipart envelope limit."}';
  }

  # Other API routes retain Nginx's default body limit and request buffering.
  location /api/ {
    proxy_pass http://gateway:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }

  location / {
    try_files $uri /index.html;
  }
}
